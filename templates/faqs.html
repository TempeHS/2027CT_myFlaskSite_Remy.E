{% extends 'base.html' %}

{% block title %}FAQs - My Flask Site{% endblock %}

{% block content %}
<section class="site-page-bg py-5">
  <div class="container">
    <div class="mb-4">
      <h1 class="display-5 fw-semibold">FAQs</h1>
      <p class="lead">Frequently asked questions.</p>
    </div>

    <div class="row justify-content-center mb-4">
      <div class="col-12 col-xl-10">
        <div class="card border-0 shadow-sm site-panel">
          <div class="card-body p-3">
            <label for="faqSearch" class="form-label fw-semibold mb-2">Search FAQs</label>
            <input type="search" id="faqSearch" class="form-control"
              placeholder="Type a keyword like rehearsal, uniform, or music">
          </div>
        </div>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="accordion shadow-sm rounded-4 overflow-hidden" id="faqAccordion">

          {% for faq in faq_items %}
          <div class="accordion-item faq-item" data-faq-item
            data-search-text="{{ (faq.question ~ ' ' ~ faq.answer)|lower }}">
            <h2 class="accordion-header" id="heading{{ loop.index }}">
              <button class="accordion-button {% if not loop.first %}collapsed{% endif %}" type="button"
                data-bs-toggle="collapse" data-bs-target="#faq{{ loop.index }}"
                aria-expanded="{{ 'true' if loop.first else 'false' }}" aria-controls="faq{{ loop.index }}">
                <b>{{ faq.question }}</b>
              </button>
            </h2>
            <div id="faq{{ loop.index }}" class="accordion-collapse collapse {% if loop.first %}show{% endif %}"
              aria-labelledby="heading{{ loop.index }}" data-bs-parent="#faqAccordion">
              <div class="accordion-body">
                {{ faq.answer }}
              </div>
            </div>
          </div>
          {% endfor %}

        </div>
        <p id="faqEmptyState" class="text-secondary mt-3 mb-0 d-none">No FAQs match that search.</p>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
  const faqSearch = document.getElementById("faqSearch");
  const faqItems = document.querySelectorAll("[data-faq-item]");
  const faqEmptyState = document.getElementById("faqEmptyState");

  if (faqSearch) {
    faqSearch.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();
      let visibleItems = 0;

      faqItems.forEach((item) => {
        const searchText = item.dataset.searchText || "";
        const isMatch = !query || searchText.includes(query);
        item.classList.toggle("d-none", !isMatch);

        if (isMatch) {
          visibleItems += 1;
        }
      });

      faqEmptyState.classList.toggle("d-none", visibleItems !== 0);
    });
  }
</script>
{% endblock %}
