<nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-primary shadow-sm" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{{ plain_url('home') }}">Tempe High School Choir</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <ul class="navbar-nav ms-auto gap-lg-2">
        <li class="nav-item">
          <a class="nav-link rounded-pill px-3 {% if request.endpoint == 'home' %}active fw-semibold bg-light text-primary{% endif %}" href="{{ plain_url('home') }}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link rounded-pill px-3 {% if request.endpoint == 'music' %}active fw-semibold bg-light text-primary{% endif %}" href="{{ plain_url('music') }}">Music</a>
        </li>

        <li class="nav-item">
          <a class="nav-link rounded-pill px-3 {% if request.endpoint == 'snack_roster' %}active fw-semibold bg-light text-primary{% endif %}" href="{{ plain_url('snack_roster') }}">Snack Roster</a>
        </li>

        <li class="nav-item">
          <a class="nav-link rounded-pill px-3 {% if request.endpoint == 'faqs' %}active fw-semibold bg-light text-primary{% endif %}" href="{{ plain_url('faqs') }}">FAQs</a>
        </li>

        <li class="nav-item">
          <a class="nav-link rounded-pill px-3 {% if request.endpoint == 'photos' %}active fw-semibold bg-light text-primary{% endif %}" href="{{ plain_url('photos') }}">Photos</a>
        </li>

        <li class="nav-item">
          <a class="nav-link rounded-pill px-3 {% if request.endpoint == 'sign_up' %}active fw-semibold bg-light text-primary{% endif %}" href="{{ plain_url('sign_up') }}">Sign Up</a>
        </li>

        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle rounded-pill px-3"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            data-bs-auto-close="outside"
            aria-expanded="false"
          >
            Accessibility
          </a>
          <div class="dropdown-menu dropdown-menu-end p-3 shadow accessibility-menu">
            <form method="post" action="{{ mono_url('update_accessibility') }}" class="d-grid gap-3">
              <input type="hidden" name="next_url" value="{{ request.path }}">

              <div>
                <p class="fw-semibold mb-2">Reading and Display</p>
                <p class="small text-secondary mb-0">These settings stay on as you move between pages.</p>
              </div>

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="prefDyslexicFont"
                  name="dyslexic_font"
                  {% if accessibility_preferences.dyslexic_font %}checked{% endif %}
                >
                <label class="form-check-label" for="prefDyslexicFont">OpenDyslexic font</label>
              </div>

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="prefDarkMode"
                  name="dark_mode"
                  {% if accessibility_preferences.dark_mode %}checked{% endif %}
                >
                <label class="form-check-label" for="prefDarkMode">Dark mode</label>
              </div>

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="prefLargeText"
                  name="large_text"
                  {% if accessibility_preferences.large_text %}checked{% endif %}
                >
                <label class="form-check-label" for="prefLargeText">Larger text</label>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-sm">Save Settings</button>
                <button type="submit" class="btn btn-outline-secondary btn-sm" name="reset" value="1">Reset</button>
              </div>
            </form>
          </div>
        </li>

        {% if session.get('is_admin') %}
        <li class="nav-item">
          <a class="nav-link rounded-pill px-3 {% if request.endpoint == 'admin_dashboard' %}active fw-semibold bg-light text-primary{% endif %}" href="{{ plain_url('admin_dashboard') }}">Admin</a>
        </li>
        <li class="nav-item d-flex align-items-center">
          <form method="post" action="{{ plain_url('admin_logout') }}" class="mb-0">
            <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3">
              Log Out
            </button>
          </form>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
